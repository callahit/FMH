name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build und Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (Warnungen als Fehler)
        run: dotnet build FMH.sln -c Release
      - name: Tests
        run: dotnet test tests/Fmh.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Testergebnisse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: tests/Fmh.Tests/TestResults/*.trx

  calibration:
    name: Kalibrierung (Toleranzen aus Abschnitt 8.1)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/Fmh.Calibrate -c Release
      - name: Matchengine (10.000 Spiele)
        run: dotnet run --project src/Fmh.Calibrate -c Release --no-build -- --matches 10000 --strict
      - name: Karriere (5 Saisons)
        run: dotnet run --project src/Fmh.Calibrate -c Release --no-build -- --season --seasons 5 --strict --max-drift 0.05
